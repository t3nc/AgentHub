[package]
name = "agenthub-desktop"
version.workspace = true
edition.workspace = true
license-file = "../../../LICENSE"
description = "AgentHub 桌面端（Tauri 2）"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# 生产构建走内嵌资源（tauri.conf.json 的 frontendDist）；不打开时一律加载 devUrl，
# 缺少它的 exe 双击后会报「localhost 拒绝连接」。
# `tauri build` 会自动加上它，裸 cargo 构建需显式 `--features custom-protocol`。
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
agenthub-core.workspace = true
# 本地 Provider 网关：只有壳层需要异步运行时，CLI 不依赖它
agenthub-gateway.workspace = true
# 文件监听只放在壳层：CLI 不需要常驻 watcher 线程
notify = "8"
notify-debouncer-full = "0.5"
# 内嵌终端：Windows 走 ConPTY，mac/Linux 走 forkpty，交给 xterm.js 渲染
portable-pty = "0.9"
# 终端字体探测：只读字体 name 表拿权威 family 名，比剥注册表字符串可靠
ttf-parser = "0.25"
# 选工作目录用的原生文件夹对话框（跨平台，走系统 API，不自绘）
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2.7.2"
